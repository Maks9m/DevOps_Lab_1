services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - lab_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./app
    command: >
      python migrate.py
      --db-host=mariadb --db-port=3306
      --db-user=${MARIADB_USER} --db-password=${MARIADB_PASSWORD}
      --db-name=${MARIADB_DATABASE}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - lab_net
    restart: "no"

  app:
    build: ./app
    command: >
      python main.py --host=0.0.0.0 --port=5200
      --db-host=mariadb --db-port=3306
      --db-user=${MARIADB_USER} --db-password=${MARIADB_PASSWORD}
      --db-name=${MARIADB_DATABASE}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - lab_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - lab_net
    restart: unless-stopped

networks:
  lab_net:
    driver: bridge

volumes:
  mariadb_data:
