---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Deploy mywebapp nginx site config
  ansible.builtin.template:
    src: mywebapp.nginx.conf.j2
    dest: /etc/nginx/sites-available/mywebapp
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable mywebapp site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/mywebapp
    dest: /etc/nginx/sites-enabled/mywebapp
    state: link
  notify: Reload nginx

- name: Ensure nginx is enabled and started
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
